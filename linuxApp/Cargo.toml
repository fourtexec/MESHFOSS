[workspace]
members = ["core", "ui", "src-tauri"]
resolver = "2"

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "GPL-3.0-only"

[workspace.dependencies]
mesh-core = { path = "core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

[profile.dev]
debug = 0

[profile.release]
strip = true

[profile.release.package.mesh-ui]
strip = false
