name: Android

# Сборка APK: JVM-тесты ядра и подписанная release-сборка.
# Публикация:
#   - тег v*      → новый релиз (alpha/beta/rc — prerelease-флаг);
#   - push в main → скользящий prerelease `nightly`, в приложении не предлагается;
#   - ветки и PR  → только сборка, без публикации.

on:
  push:
    branches: [main, 'arena/**', 'design/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Один активный запуск на ветку/тег: предыдущий отменяется, чтобы не жечь минуты.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_PACKAGES: 'platforms;android-35 build-tools;35.0.0'
  BUILD_TOOLS_VERSION: '35.0.0'
  # Человекочитаемое представление списка пакетов для ключа кеша SDK.
  ANDROID_SDK_CACHE_KEY: android-35-build-tools-35.0.0

jobs:
  build:
    name: APK (Kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          # Полная история с тегами — для git describe в версии nightly-сборок.
          fetch-depth: 0

      - name: Версия сборки
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -eu
          VERSION_CODE="${RUN_NUMBER}"
          PUBLISH="none"
          case "${GITHUB_REF}" in
            refs/tags/v*)
              # Релиз: версия берётся из тэга (v2.0.0 → 2.0.0).
              VERSION_NAME="${GITHUB_REF_NAME#v}"
              if [ "${GITHUB_EVENT_NAME}" = "push" ]; then PUBLISH="release"; fi
              ;;
            *)
              # База версии — ближайший тег vX.Y.Z (суффиксы -beta и т.п. отрезаем).
              BASE="$(git describe --tags --match 'v[0-9]*' --abbrev=0 2>/dev/null | sed -E 's/^v([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
              if [ -z "${BASE}" ]; then BASE="2.0.0"; fi
              VERSION_NAME="${BASE}-dev.${VERSION_CODE}"
              if [ "${GITHUB_REF}" = "refs/heads/main" ] && [ "${GITHUB_EVENT_NAME}" = "push" ]; then
                PUBLISH="nightly"
              fi
              ;;
          esac
          {
            echo "VERSION_CODE=${VERSION_CODE}"
            echo "VERSION_NAME=${VERSION_NAME}"
          } >> "$GITHUB_ENV"
          {
            echo "version_code=${VERSION_CODE}"
            echo "version_name=${VERSION_NAME}"
            echo "publish=${PUBLISH}"
          } >> "$GITHUB_OUTPUT"
          echo "Сборка ${VERSION_NAME} (versionCode ${VERSION_CODE}), публикация: ${PUBLISH}"

      - name: Подготовить release-подпись
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -eu
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Кеш Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}/platforms/android-35
            ${{ env.ANDROID_SDK_ROOT }}/build-tools/${{ env.BUILD_TOOLS_VERSION }}
          key: android-sdk-${{ runner.os }}-${{ env.ANDROID_SDK_CACHE_KEY }}-${{ hashFiles('.github/workflows/android.yml') }}
          restore-keys: |
            android-sdk-${{ runner.os }}-${{ env.ANDROID_SDK_CACHE_KEY }}-

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ${{ env.ANDROID_PACKAGES }}

      - name: Gradle (кеш и wrapper)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Тесты и release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --warning-mode all testDebugUnitTest assembleRelease

      - name: Проверка подписи APK
        run: |
          set -eu
          "$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Подготовить APK для релиза
        run: cp app/build/outputs/apk/release/app-release.apk "mesh-ranker-${VERSION_NAME}.apk"

      - name: Релиз по тэгу
        # Новая версия создаётся только по тэгу v*.
        if: steps.version.outputs.publish == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MESHFOSS ${{ steps.version.outputs.version_name }}
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          body: |
            Автоматическая подписанная release-сборка.

            - versionCode: `${{ steps.version.outputs.version_code }}`
            - commit: `${{ github.sha }}`
          files: mesh-ranker-${{ steps.version.outputs.version_name }}.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Nightly-пререлиз (main)
        # Каждый push в main обновляет скользящий prerelease `nightly` —
        # это и есть канал «Пререлизы» в приложении; авто-предупреждений
        # из него нет, предлагается только при ручной проверке.
        if: steps.version.outputs.publish == 'nightly'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          gh release delete nightly --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create nightly \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "MESHFOSS Nightly ${VERSION_NAME}" \
            --notes "Ночная сборка из main. Скользящий prerelease: авто-обновления из него нет, ставится при ручной проверке на канале «Пререлизы».

          - versionCode: \`${VERSION_CODE}\`
          - commit: \`${GITHUB_SHA}\`" \
            "mesh-ranker-${VERSION_NAME}.apk"
