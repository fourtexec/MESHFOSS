name: Android pre-release

# Отдельная сборка для non-main веток: debug APK и GitHub pre-release.
# Не пересекается с android.yml (стабильные релизы и nightly из main).
on:
  push:
    branches:
      - 'refactor/**'
      - 'feature/**'
      - 'design/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_PACKAGES: 'platforms;android-37.1 build-tools;36.0.0 build-tools;37.0.0'
  BUILD_TOOLS_VERSION: '37.0.0'

jobs:
  build:
    name: Build and publish pre-release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set build version
        run: |
          set -eu
          BASE="$(git describe --tags --match 'v[0-9]*' --abbrev=0 2>/dev/null | sed -E 's/^v([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          if [ -z "${BASE}" ]; then BASE="2.0.0"; fi
          VERSION_CODE="${GITHUB_RUN_NUMBER}"
          VERSION_NAME="${BASE}-cdz-ui.${VERSION_CODE}"
          {
            echo "VERSION_CODE=${VERSION_CODE}"
            echo "VERSION_NAME=${VERSION_NAME}"
          } >> "$GITHUB_ENV"
          echo "Сборка ${VERSION_NAME} (versionCode ${VERSION_CODE})"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ${{ env.ANDROID_PACKAGES }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run JVM tests and build debug APK
        env:
          ANALYTICS_API_KEY: ${{ secrets.ANALYTICS_API_KEY }}
        run: ./gradlew --no-daemon --warning-mode all testDebugUnitTest assembleDebug

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "mesh-ranker-${VERSION_NAME}.apk"

      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cdz-ui-ux-${{ github.run_number }}
          name: MESH Ranker ${{ env.VERSION_NAME }}
          body: |
            Debug-сборка ветки `${{ github.ref_name }}` для проверки CDZ UI/UX.

            - компактные адаптивные inline-поля;
            - M3E-переходы и жесты внутри ЦДЗ;
            - debug applicationId, устанавливается рядом со стабильной версией.
          prerelease: true
          generate_release_notes: true
          files: mesh-ranker-${{ env.VERSION_NAME }}.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
