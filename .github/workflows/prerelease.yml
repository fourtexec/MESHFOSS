name: Linux and Android pre-release

on:
  push:
    branches: [test-branch-lexus, linux-app]
    tags: ['linux-v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish pre-release APK
    if: github.ref == 'refs/heads/test-branch-lexus'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set build version
        run: |
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.${GITHUB_RUN_NUMBER}-test" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon --warning-mode all assembleDebug

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "mesh-ranker-${VERSION_NAME}.apk"

      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-branch-lexus-${{ github.run_number }}
          name: MESH Ranker ${{ env.VERSION_NAME }}
          prerelease: true
          generate_release_notes: true
          files: mesh-ranker-${{ env.VERSION_NAME }}.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux:
    name: Test and package MESHFOSS for Linux x86-64
    if: github.ref == 'refs/heads/linux-app' || startsWith(github.ref, 'refs/tags/linux-v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: linuxApp
    env:
      NO_COLOR: "true"
      APPIMAGE_EXTRACT_AND_RUN: "1"
      NO_STRIP: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf libfuse2t64 xvfb webkit2gtk-driver dbus-x11
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: linuxApp
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.21.14
      - name: Determine package version
        id: version
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          base = json.loads(Path("src-tauri/tauri.conf.json").read_text())["version"]
          tag_build = os.environ["GITHUB_REF"].startswith("refs/tags/linux-v")
          if tag_build:
              version = os.environ["GITHUB_REF_NAME"].removeprefix("linux-v")
          else:
              major, minor, patch = base.split(".")
              version = f"{major}.{minor}.{int(patch) + 1}-dev.{os.environ['GITHUB_RUN_NUMBER']}"
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              print(f"version={version}", file=out)
              print(f"prerelease={str('-' in version).lower()}", file=out)
          Path(os.environ["RUNNER_TEMP"], "mesh-version.json").write_text(json.dumps({"version": version}))
          PY
      - name: Test Rust and WebAssembly targets
        run: |
          trunk build --release
          cargo test --locked -p mesh-core -p mesh-ranker
          cargo check --locked -p mesh-ui --target wasm32-unknown-unknown
      - name: Build Linux packages
        run: npx --yes --package=@tauri-apps/cli@2.12.6 tauri build --bundles deb,appimage --config "$RUNNER_TEMP/mesh-version.json"
      - name: Verify package payloads
        run: |
          dpkg-deb -x target/release/bundle/deb/*.deb "$RUNNER_TEMP/mesh-installed"
          test -x "$RUNNER_TEMP/mesh-installed/usr/bin/mesh-ranker"
          target/release/bundle/appimage/*.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          dbus-run-session -- xvfb-run -a -s '-screen 0 1400x950x24' python3 tests/desktop_smoke.py "$RUNNER_TEMP/mesh-installed/usr/bin/mesh-ranker"
          dbus-run-session -- xvfb-run -a -s '-screen 0 1400x950x24' python3 tests/desktop_smoke.py squashfs-root/AppRun
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: meshfoss-linux-x86_64
          path: |
            linuxApp/target/release/bundle/deb/*.deb
            linuxApp/target/release/bundle/appimage/*.AppImage
      - name: Publish Linux release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: linux-v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: MESHFOSS Linux ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            linuxApp/target/release/bundle/deb/*.deb
            linuxApp/target/release/bundle/appimage/*.AppImage
          fail_on_unmatched_files: true
